# Weekly: confirm every catalogue source is reachable from GitHub's runners and quotes still match.
# A failure e-mails the owner; the daily job already skips unreachable topics on its own.
name: check-sources

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m instagram_pipeline check-sources
